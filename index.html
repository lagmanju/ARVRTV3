<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Fit Check V3</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
    <!-- Google Model Viewer -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <!-- Three.js, used only to generate the TV models in the browser -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/GLTFExporter.js"></script>

    <style>
      :root {
        --ink: #111111;
        --paper: #F4F2ED;
        --white: #ffffff;
        --muted: #5b5f66;

        /* Amazon language */
        --amz-navy: #232F3E;
        --amz-orange: #FF9900;
        --amz-cart: #FFD814;
        --amz-buy: #FFA41C;
        --amz-star: #FFA41C;

        /* Expressive bento palette */
        --c-yellow: #FFE15A;
        --c-blue: #8FD0FA;
        --c-green: #7EE2B0;
        --c-coral: #FF8A80;
        --c-purple: #A78BFA;
        --c-black: #111111;

        --display: 'Inter Tight', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        --mono: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
        --sticker: 0 4px 0 var(--ink);
      }

      * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body { height: 100%; background: var(--paper); overflow: hidden; font-family: var(--display); color: var(--ink); }
      button { font-family: inherit; color: inherit; }

      model-viewer#viewer {
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        background: radial-gradient(120% 70% at 50% 34%, #ffffff 0%, #F4F2ED 62%, #ECE8DF 100%);
        --poster-color: transparent;
        --ar-button-display: none;
      }

      /* Hidden helper viewer used only to launch Quick Look on iPhone */
      model-viewer#ql-viewer {
        position: fixed; left: -9999px; top: 0; width: 2px; height: 2px;
        --ar-button-display: none;
      }

      /* ---------- PILLS ---------- */
      .pill {
        display: inline-flex; align-items: center; gap: 7px;
        font-family: var(--mono); font-size: 10.5px; font-weight: 700;
        letter-spacing: 0.4px; text-transform: uppercase;
        padding: 6px 11px; border-radius: 999px; white-space: nowrap;
      }
      .pill.dark { background: var(--ink); color: var(--white); }
      .pill.light { background: var(--white); color: var(--ink); border: 1.5px solid var(--ink); }
      .pill .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--amz-orange); }
      body.in-ar .pill .dot { background: #3ddc84; box-shadow: 0 0 0 3px rgba(61,220,132,0.3); }

      /* ---------- TOP ---------- */
      .top-ui {
        position: absolute; top: 0; left: 0; right: 0; z-index: 5;
        padding: calc(env(safe-area-inset-top) + 14px) 18px 0;
        pointer-events: none;
      }
      .top-row { display: flex; justify-content: space-between; align-items: center; }
      .headline {
        margin-top: 16px;
        font-size: 40px; line-height: 0.95; font-weight: 900; letter-spacing: -1.8px;
      }
      .headline mark {
        background: var(--c-yellow); color: var(--ink);
        padding: 0 8px 2px; border-radius: 10px;
        box-decoration-break: clone; -webkit-box-decoration-break: clone;
      }
      .tagline { margin-top: 10px; font-size: 14px; font-weight: 500; color: var(--muted); max-width: 260px; }
      body.in-ar .headline, body.in-ar .tagline { display: none; }

      /* ---------- BOTTOM SHEET ---------- */
      .sheet {
        position: absolute; left: 0; right: 0; bottom: 0; z-index: 5;
        background: var(--paper);
        border-top-left-radius: 28px; border-top-right-radius: 28px;
        border-top: 2px solid var(--ink);
        padding: 10px 0 calc(env(safe-area-inset-bottom) + 14px);
        box-shadow: 0 -10px 30px rgba(0,0,0,0.12);
      }
      .grabber { width: 40px; height: 5px; border-radius: 3px; background: rgba(17,17,17,0.18); margin: 0 auto 10px; }

      .sheet-head {
        display: flex; justify-content: space-between; align-items: center;
        padding: 0 16px 10px;
      }
      .sheet-title { font-family: var(--mono); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }

      .toggle {
        display: inline-flex; align-items: center; gap: 7px;
        background: var(--white); border: 1.5px solid var(--ink); border-radius: 999px;
        padding: 6px 11px; cursor: pointer;
        font-family: var(--mono); font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px;
      }
      .toggle .swatch { width: 15px; height: 11px; border: 2.5px solid var(--amz-orange); border-radius: 3px; opacity: 0.3; transition: opacity 0.15s; }
      .toggle[aria-pressed="true"] { background: var(--ink); color: var(--white); }
      .toggle[aria-pressed="true"] .swatch { opacity: 1; }

      /* ---------- BENTO READOUT ---------- */
      .bento {
        display: grid; grid-template-columns: 1fr 1.35fr 1fr; gap: 8px;
        padding: 0 16px 12px;
      }
      .tile { border-radius: 18px; padding: 10px 12px; min-height: 74px; display: flex; flex-direction: column; justify-content: space-between; }
      .tile .k { font-family: var(--mono); font-size: 9.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px; opacity: 0.75; }
      .tile.size { background: var(--c-yellow); }
      .tile.size .v { font-size: 38px; font-weight: 900; letter-spacing: -2px; line-height: 0.9; display: inline-block; transform-origin: left bottom; }
      .tile.dims { background: var(--c-blue); }
      .tile.dims .v { font-size: 19px; font-weight: 800; letter-spacing: -0.6px; line-height: 1; }
      .tile.dims .sub { font-size: 11px; font-weight: 600; opacity: 0.7; margin-top: 2px; }
      .tile.seat { background: var(--c-green); }
      .tile.seat .v { font-size: 17px; font-weight: 800; letter-spacing: -0.5px; line-height: 1.05; }
      body.in-ar .bento { display: none; }

      .bump { animation: bump 0.24s ease-out; }
      @keyframes bump { 0% { transform: scale(1); } 45% { transform: scale(1.16) rotate(-2deg); } 100% { transform: scale(1); } }

      /* ---------- SIZE CAROUSEL ---------- */
      .carousel {
        position: relative;
        display: flex; gap: 10px;
        overflow-x: auto; overflow-y: hidden;
        scroll-snap-type: x mandatory;
        padding: 6px calc(50% - 70px) 14px;
        scrollbar-width: none;
        -webkit-overflow-scrolling: touch;
      }
      .carousel::-webkit-scrollbar { display: none; }

      .card {
        flex: 0 0 140px;
        scroll-snap-align: center;
        border: 2px solid transparent;
        border-radius: 22px;
        padding: 11px 12px 12px;
        text-align: left; cursor: pointer;
        display: flex; flex-direction: column; gap: 2px;
        transition: transform 0.18s cubic-bezier(.3,1.5,.6,1), box-shadow 0.18s, border-color 0.18s, opacity 0.18s;
        opacity: 0.82;
      }
      .card.active { border-color: var(--ink); box-shadow: var(--sticker); transform: translateY(-4px); opacity: 1; }

      .card.yellow { background: var(--c-yellow); }
      .card.blue { background: var(--c-blue); }
      .card.green { background: var(--c-green); }
      .card.coral { background: var(--c-coral); }
      .card.purple { background: var(--c-purple); }
      .card.black { background: var(--c-black); color: var(--white); }
      .card.black.active { border-color: var(--amz-orange); box-shadow: 0 4px 0 var(--amz-orange); }

      .card-top { display: flex; justify-content: space-between; align-items: flex-start; min-height: 30px; }
      .tag {
        font-family: var(--mono); font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.3px;
        background: var(--ink); color: var(--white); padding: 4px 7px; border-radius: 999px;
      }
      .card.black .tag { background: var(--amz-orange); color: var(--ink); }
      .mini { width: 46px; height: 30px; display: flex; align-items: center; justify-content: center; }
      .mini i { display: block; background: var(--ink); border-radius: 2px; }
      .card.black .mini i { background: var(--white); }

      .card .size { font-size: 40px; font-weight: 900; letter-spacing: -2px; line-height: 0.95; margin-top: 2px; }
      .card .name { font-size: 12px; font-weight: 600; line-height: 1.2; opacity: 0.85; }
      .card .rating { font-size: 11px; font-weight: 700; margin-top: 3px; }
      .card .rating .stars { color: var(--ink); letter-spacing: -0.5px; }
      .card.black .rating .stars { color: var(--amz-star); }
      .card .rating .count { opacity: 0.6; font-weight: 600; }
      .card .price { font-size: 24px; font-weight: 800; letter-spacing: -0.8px; margin-top: 4px; line-height: 1; }
      .card .price sup { font-size: 11px; font-weight: 700; vertical-align: top; position: relative; top: 2px; letter-spacing: 0; }

      /* ---------- ACTIONS ---------- */
      .actions { display: flex; gap: 10px; padding: 2px 16px 0; }
      .btn {
        flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
        border: 2px solid var(--ink); border-radius: 999px;
        padding: 13px 14px; font-size: 15px; font-weight: 800; letter-spacing: -0.2px;
        cursor: pointer; box-shadow: 0 3px 0 var(--ink);
        transition: transform 0.08s, box-shadow 0.08s;
      }
      .btn:active { transform: translateY(3px); box-shadow: 0 0 0 var(--ink); }
      .btn svg { width: 18px; height: 18px; }
      .btn-cart { background: var(--amz-cart); }
      .btn-cart.added { background: var(--c-green); }
      .btn-ar { background: var(--ink); color: var(--white); flex: 1.25; }
      .btn-ar svg { fill: var(--amz-cart); }
      .btn-ar:disabled { background: #d9d6cf; color: var(--muted); border-color: #bdb9b0; box-shadow: none; }
      .btn-ar:disabled svg { fill: var(--muted); }
      body.in-ar .btn-ar { display: none; }

      /* ---------- DIMENSION CALLOUTS (pinned to the TV) ---------- */
      .dim {
        display: inline-flex; align-items: center; gap: 6px;
        background: var(--ink); color: var(--white);
        font-family: var(--mono); font-size: 11.5px; font-weight: 700;
        padding: 6px 10px; border-radius: 999px; white-space: nowrap;
        pointer-events: none;
        box-shadow: 0 3px 10px rgba(0,0,0,0.25);
      }
      .dim::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--amz-cart); }

      /* ---------- TOAST ---------- */
      .toast {
        position: absolute; left: 50%; top: calc(env(safe-area-inset-top) + 58px);
        transform: translate(-50%, -8px);
        background: var(--ink); color: var(--white);
        font-size: 13.5px; font-weight: 600;
        padding: 11px 16px; border-radius: 16px;
        max-width: 88vw; text-align: center; z-index: 6;
        opacity: 0; transition: opacity 0.25s, transform 0.25s; pointer-events: none;
      }
      .toast.show { opacity: 1; transform: translate(-50%, 0); }
    </style>
  </head>
  <body>

    <model-viewer
      id="viewer"
      ar
      ar-modes="webxr scene-viewer quick-look"
      ar-placement="wall"
      ar-scale="fixed"
      camera-controls
      interaction-prompt="none"
      shadow-intensity="0"
      alt="True-scale TV preview">

      <!-- Everything inside model-viewer stays visible during WebXR AR on Android -->
      <div class="top-ui">
        <div class="top-row">
          <span class="pill dark"><span class="dot"></span>Fit Check</span>
          <span class="pill light" id="mode-pill">True scale</span>
        </div>
        <h1 class="headline">Will it <mark>fit?</mark></h1>
        <p class="tagline">Scroll real sizes and see each one on your wall before you buy.</p>
      </div>

      <div class="toast" id="toast"></div>

      <div class="dim" slot="hotspot-width" data-position="0 0.5 0.04" data-normal="0 0 1" id="dim-width"></div>
      <div class="dim" slot="hotspot-height" data-position="0.7 0 0.04" data-normal="0 0 1" id="dim-height"></div>

      <div class="sheet" id="sheet">
        <div class="grabber"></div>
        <div class="sheet-head">
          <span class="sheet-title">Pick a size · 6 options</span>
          <button class="toggle" id="neighbors" aria-pressed="true">
            <span class="swatch"></span>Compare
          </button>
        </div>

        <div class="bento">
          <div class="tile size">
            <span class="k">Selected</span>
            <span class="v" id="size-value">55"</span>
          </div>
          <div class="tile dims">
            <span class="k">Width × Height</span>
            <div>
              <div class="v" id="dims-in"></div>
              <div class="sub" id="dims-cm"></div>
            </div>
          </div>
          <div class="tile seat">
            <span class="k">Best seat</span>
            <span class="v" id="seat"></span>
          </div>
        </div>

        <div class="carousel" id="carousel" aria-label="TV sizes"></div>

        <div class="actions">
          <button class="btn btn-cart" id="cart-btn">Add to Cart</button>
          <button class="btn btn-ar" id="ar-btn" aria-label="View on your wall">
            <svg viewBox="0 0 24 24"><path d="M21 3H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h5v2h8v-2h5c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 14H3V5h18v12z"/></svg>
            <span id="ar-label">View on your wall</span>
          </button>
        </div>
      </div>
    </model-viewer>

    <!-- iPhone only: Quick Look cannot show web UI, so this viewer holds a
         single-size model (selected TV plus neighbor outlines) for launching AR -->
    <model-viewer
      id="ql-viewer"
      ar
      ar-modes="quick-look"
      ar-placement="wall"
      ar-scale="fixed"
      loading="eager"
      alt="">
    </model-viewer>

    <script>
      // ---------- PRODUCT DATA (mock catalog for the prototype) ----------
      const TVS = [
        { size: 43, name: '4K UHD Smart TV',  price: 249.99,  rating: 4.4, reviews: '8.2k', tag: 'Prime',      color: 'yellow' },
        { size: 50, name: '4K UHD Smart TV',  price: 299.99,  rating: 4.5, reviews: '6.7k', tag: 'Prime',      color: 'blue' },
        { size: 55, name: '4K QLED Smart TV', price: 379.99,  rating: 4.6, reviews: '12k',  tag: 'Best seller', color: 'green' },
        { size: 65, name: '4K QLED Smart TV', price: 529.99,  rating: 4.6, reviews: '9.4k', tag: 'Prime',      color: 'coral' },
        { size: 75, name: '4K QLED Smart TV', price: 799.99,  rating: 4.5, reviews: '3.1k', tag: 'Prime',      color: 'purple' },
        { size: 85, name: '4K Mini-LED TV',   price: 1199.99, rating: 4.7, reviews: '1.8k', tag: 'Premium',    color: 'black' }
      ];

      // ---------- REAL-WORLD GEOMETRY ----------
      const IN_TO_M = 0.0254;
      const BEZEL_IN = 0.4;   // bezel on each side
      const DEPTH_IN = 1.2;   // panel thickness
      const DIAG = Math.sqrt(16 * 16 + 9 * 9);
      const MAX_SIZE = 85;

      function dims(diagonalIn) {
        const w = diagonalIn * 16 / DIAG;
        const h = diagonalIn * 9 / DIAG;
        return { w, h, ow: w + 2 * BEZEL_IN, oh: h + 2 * BEZEL_IN };
      }

      // ---------- STATE ----------
      let current = 2;            // start on 55"
      let showNeighbors = true;
      let materialsByName = {};
      const cart = new Set();

      const viewer = document.getElementById('viewer');
      const qlViewer = document.getElementById('ql-viewer');
      const carousel = document.getElementById('carousel');
      const sheet = document.getElementById('sheet');
      const neighborsBtn = document.getElementById('neighbors');
      const arBtn = document.getElementById('ar-btn');
      const arLabel = document.getElementById('ar-label');
      const cartBtn = document.getElementById('cart-btn');
      const modePill = document.getElementById('mode-pill');
      const toast = document.getElementById('toast');
      const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
                    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

      // ---------- MODEL GENERATION ----------
      // Combined mode (onlyIndex undefined): every size lives in one model,
      // each with its own materials, so sizes can be switched live inside an
      // AR session by changing material opacity. The TV never gets re-placed.
      // Single mode (onlyIndex set): just the chosen TV plus neighbor outlines,
      // used for iPhone Quick Look.
      function buildScene(onlyIndex) {
        const scene = new THREE.Scene();
        const depth = DEPTH_IN * IN_TO_M;
        const single = onlyIndex !== undefined;

        TVS.forEach((tv, i) => {
          const d = dims(tv.size);
          const ow = d.ow * IN_TO_M, oh = d.oh * IN_TO_M;
          const w = d.w * IN_TO_M, h = d.h * IN_TO_M;

          const isActive = single && i === onlyIndex;
          const isNeighbor = single && showNeighbors && Math.abs(i - onlyIndex) === 1;

          if (!single || isActive) {
            const frameMat = new THREE.MeshStandardMaterial({
              name: 'frame_' + tv.size, color: 0x111111, roughness: 0.3, metalness: 0.6,
              transparent: !single, opacity: single ? 1 : 0
            });
            const frame = new THREE.Mesh(new THREE.BoxGeometry(ow, oh, depth), frameMat);
            frame.position.z = depth / 2;   // back of the TV sits on the wall (z = 0)
            scene.add(frame);

            const screenMat = new THREE.MeshStandardMaterial({
              name: 'screen_' + tv.size, color: 0x0b0f14, roughness: 0.08, metalness: 0.85,
              transparent: !single, opacity: single ? 1 : 0
            });
            const screen = new THREE.Mesh(new THREE.PlaneGeometry(w, h), screenMat);
            screen.position.z = depth + 0.0008;
            scene.add(screen);
          }

          if (!single || isNeighbor) {
            // Outline of the TV's full footprint, drawn just in front of the panel
            const t = 0.75 * IN_TO_M;
            const shape = new THREE.Shape();
            shape.moveTo(-ow / 2, -oh / 2);
            shape.lineTo(ow / 2, -oh / 2);
            shape.lineTo(ow / 2, oh / 2);
            shape.lineTo(-ow / 2, oh / 2);
            shape.lineTo(-ow / 2, -oh / 2);
            const hole = new THREE.Path();
            hole.moveTo(-ow / 2 + t, -oh / 2 + t);
            hole.lineTo(-ow / 2 + t, oh / 2 - t);
            hole.lineTo(ow / 2 - t, oh / 2 - t);
            hole.lineTo(ow / 2 - t, -oh / 2 + t);
            hole.lineTo(-ow / 2 + t, -oh / 2 + t);
            shape.holes.push(hole);

            const ghostMat = new THREE.MeshBasicMaterial({
              name: 'ghost_' + tv.size, color: 0xff9900,
              transparent: !single, opacity: single ? 1 : 0
            });
            const ghost = new THREE.Mesh(new THREE.ShapeGeometry(shape), ghostMat);
            ghost.position.z = depth + 0.004 + i * 0.0005;
            scene.add(ghost);
          }
        });

        return scene;
      }

      function exportGLB(scene) {
        return new Promise((resolve) => {
          new THREE.GLTFExporter().parse(scene, (glb) => {
            resolve(URL.createObjectURL(new Blob([glb], { type: 'model/gltf-binary' })));
          }, { binary: true });
        });
      }

      // ---------- APPLYING A SIZE ----------
      function setAlpha(name, a) {
        const m = materialsByName[name];
        if (!m) return;
        const f = m.pbrMetallicRoughness.baseColorFactor;
        m.pbrMetallicRoughness.setBaseColorFactor([f[0], f[1], f[2], a]);
      }

      function applyVisibility() {
        TVS.forEach((tv, i) => {
          const on = i === current;
          const ghost = showNeighbors && Math.abs(i - current) === 1;
          setAlpha('frame_' + tv.size, on ? 1 : 0);
          setAlpha('screen_' + tv.size, on ? 1 : 0);
          setAlpha('ghost_' + tv.size, ghost ? 0.95 : 0);
        });
      }

      function updateHotspots() {
        const d = dims(TVS[current].size);
        const ow = d.ow * IN_TO_M, oh = d.oh * IN_TO_M;
        const z = DEPTH_IN * IN_TO_M + 0.006;
        document.getElementById('dim-width').textContent = 'W ' + d.ow.toFixed(1) + ' in';
        document.getElementById('dim-height').textContent = 'H ' + d.oh.toFixed(1) + ' in';
        if (typeof viewer.updateHotspot === 'function') {
          viewer.updateHotspot({ name: 'hotspot-width', position: '0 ' + (oh / 2 + 0.07) + ' ' + z });
          viewer.updateHotspot({ name: 'hotspot-height', position: (ow / 2 + 0.13) + ' 0 ' + z });
        }
      }

      function updateReadout(animate) {
        const tv = TVS[current];
        const d = dims(tv.size);
        const val = document.getElementById('size-value');
        val.textContent = tv.size + '"';
        document.getElementById('dims-in').textContent = d.ow.toFixed(1) + ' × ' + d.oh.toFixed(1) + '"';
        document.getElementById('dims-cm').textContent = Math.round(d.ow * 2.54) + ' × ' + Math.round(d.oh * 2.54) + ' cm';
        // Rule of thumb for 4K: sit about 1.0 to 1.5 times the diagonal away
        document.getElementById('seat').textContent =
          (tv.size / 12).toFixed(1) + ' to ' + (tv.size * 1.5 / 12).toFixed(1) + ' ft';
        if (animate) {
          val.classList.remove('bump');
          void val.offsetWidth;
          val.classList.add('bump');
        }
        updateCartButton();
      }

      function updateCartButton() {
        const inCart = cart.has(current);
        cartBtn.classList.toggle('added', inCart);
        cartBtn.textContent = inCart ? 'In your cart ✓' : 'Add to Cart';
      }

      let qlTimer = null;
      function refreshQuickLookModel() {
        if (!isIOS) return;
        clearTimeout(qlTimer);
        qlTimer = setTimeout(async () => {
          qlViewer.src = await exportGLB(buildScene(current));
        }, 250);
      }

      function select(i, fromScroll) {
        if (i === current) return;
        current = i;
        cards.forEach((c, j) => c.classList.toggle('active', j === current));
        applyVisibility();
        updateHotspots();
        updateReadout(true);
        refreshQuickLookModel();
        if (navigator.vibrate) navigator.vibrate(8);   // Android only; iOS gets the visual bump
        if (!fromScroll) centerCard(i, true);
      }

      // ---------- CAROUSEL ----------
      function priceHTML(p) {
        const [dollars, cents] = p.toFixed(2).split('.');
        return '<sup>$</sup>' + Number(dollars).toLocaleString('en-US') + '<sup>' + cents + '</sup>';
      }

      function starsText(r) {
        const full = Math.floor(r);
        const half = r - full >= 0.5;
        return '★'.repeat(full) + (half ? '½' : '');
      }

      const cards = TVS.map((tv, i) => {
        const miniW = Math.round(44 * tv.size / MAX_SIZE);
        const miniH = Math.round(miniW * 9 / 16);
        const b = document.createElement('button');
        b.className = 'card ' + tv.color + (i === current ? ' active' : '');
        b.setAttribute('aria-label', tv.size + ' inch ' + tv.name + ', $' + tv.price);
        b.innerHTML =
          '<div class="card-top"><span class="tag">' + tv.tag + '</span>' +
            '<span class="mini"><i style="width:' + miniW + 'px;height:' + miniH + 'px"></i></span></div>' +
          '<div class="size">' + tv.size + '"</div>' +
          '<div class="name">' + tv.name + '</div>' +
          '<div class="rating"><span class="stars">' + starsText(tv.rating) + '</span> ' + tv.rating +
            ' <span class="count">(' + tv.reviews + ')</span></div>' +
          '<div class="price">' + priceHTML(tv.price) + '</div>';
        b.addEventListener('click', () => select(i, false));
        carousel.appendChild(b);
        return b;
      });

      function centerCard(i, smooth) {
        const c = cards[i];
        const left = c.offsetLeft - (carousel.clientWidth - c.offsetWidth) / 2;
        carousel.scrollTo({ left, behavior: smooth ? 'smooth' : 'auto' });
      }

      function nearestCard() {
        const r = carousel.getBoundingClientRect();
        const cx = r.left + r.width / 2;
        let best = 0, bestDist = Infinity;
        cards.forEach((c, i) => {
          const cr = c.getBoundingClientRect();
          const dist = Math.abs(cr.left + cr.width / 2 - cx);
          if (dist < bestDist) { bestDist = dist; best = i; }
        });
        return best;
      }

      // The TV changes size live while scrolling, snapping to the nearest real size
      let ticking = false;
      carousel.addEventListener('scroll', () => {
        if (ticking) return;
        ticking = true;
        requestAnimationFrame(() => {
          ticking = false;
          select(nearestCard(), true);
        });
      }, { passive: true });

      // Keep taps on the UI from also moving the TV during WebXR AR
      sheet.addEventListener('beforexrselect', (e) => e.preventDefault());

      // ---------- CONTROLS ----------
      neighborsBtn.addEventListener('click', () => {
        showNeighbors = !showNeighbors;
        neighborsBtn.setAttribute('aria-pressed', String(showNeighbors));
        applyVisibility();
        refreshQuickLookModel();
      });

      cartBtn.addEventListener('click', () => {
        const tv = TVS[current];
        if (cart.has(current)) {
          cart.delete(current);
          showToast('Removed the ' + tv.size + '" from your cart', 1800);
        } else {
          cart.add(current);
          showToast('Added the ' + tv.size + '" ' + tv.name + ' to your cart', 2200);
          if (navigator.vibrate) navigator.vibrate([10, 40, 10]);
        }
        updateCartButton();
      });

      arBtn.addEventListener('click', () => {
        if (isIOS) qlViewer.activateAR();
        else viewer.activateAR();
      });

      let toastTimer = null;
      function showToast(msg, ms) {
        toast.textContent = msg;
        toast.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove('show'), ms || 3500);
      }

      viewer.addEventListener('ar-status', (e) => {
        const s = e.detail.status;
        if (s === 'session-started') {
          document.body.classList.add('in-ar');
          modePill.textContent = 'Live on your wall';
          showToast('Aim at a wall and tap to place. Scroll below to try other sizes.', 4500);
        } else if (s === 'object-placed') {
          showToast('Placed at true scale. Scroll sizes to compare.', 2500);
        } else if (s === 'not-presenting' || s === 'failed') {
          document.body.classList.remove('in-ar');
          modePill.textContent = 'True scale';
          if (s === 'failed') showToast('AR could not start on this device.', 3000);
        }
      });

      viewer.addEventListener('load', () => {
        materialsByName = {};
        viewer.model.materials.forEach((m) => { materialsByName[m.name] = m; });
        applyVisibility();
        updateHotspots();

        const canAR = viewer.canActivateAR || isIOS;
        arBtn.disabled = !canAR;
        if (!canAR) arLabel.textContent = 'Open on phone';
      });

      // ---------- INIT ----------
      customElements.whenDefined('model-viewer').then(async () => {
        updateReadout(false);
        centerCard(current, false);
        viewer.src = await exportGLB(buildScene());
        if (isIOS) qlViewer.src = await exportGLB(buildScene(current));
      });
    </script>
  </body>
</html>
